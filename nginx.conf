server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Bloqueia clickjacking (site sendo embutido em iframe de outro domínio)
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Impede que o browser "adivinhe" o tipo de arquivo (evita XSS via upload)
    add_header X-Content-Type-Options "nosniff" always;

    # Não envia o endereço do site como referência ao clicar em links externos
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Desativa funcionalidades do browser que não são usadas no site
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Força HTTPS mesmo que o browser tente HTTP (válido por 1 ano)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
